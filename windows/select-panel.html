    <!-- New "Select" window (VSL request: "copy the modify window, rename it
         to Select"). Deliberately lighter-weight than Modify: it has no own
         picking-arm state — it just reflects the same selectedFeature/
         selectedLayerType the map's normal click handler and on-map action
         toolbar already use (see showParcelActionToolbar/closeInfoPopup in
         js/map-app.js), so clicking any plot/block on the map updates this
         panel automatically whenever it's open. The Plot/Block/Feature tabs
         switch the empty-state hint text; Log Activity/Alert reuse the same
         joined split-button pattern as feature-info-panel.html, and Info
         reuses openFeatureInfoPanel — same functions the on-map toolbar
         already calls. -->
    <div id="selectPanel" class="select-panel popWinMain popWin-mobileDock" hidden>
      <header class="popWinHead">
        <div class="popWinHead__inner">
          <span class="popWinIcon"><i class="fas fa-vector-square" aria-hidden="true"></i></span>
          <h2 class="popWinTitle">Select</h2>
        </div>
        <button type="button" class="popWinCloseBtn" id="selectCloseBtn" aria-label="Close select panel">
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </header>

      <div class="popWinBodyRow">
        <div class="popWinTabs popWinTabs--vertical" role="tablist" aria-label="Select target">
          <button type="button" class="search-tab" id="selectTabPlot" role="tab" aria-selected="true" data-tab="parcel">
            <i class="fas fa-map" aria-hidden="true"></i> Plot
          </button>
          <button type="button" class="search-tab" id="selectTabBlock" role="tab" aria-selected="false" tabindex="-1" data-tab="block">
            <i class="fas fa-cubes" aria-hidden="true"></i> Block
          </button>
          <button type="button" class="search-tab" id="selectTabFeature" role="tab" aria-selected="false" tabindex="-1" data-tab="feature">
            <i class="fas fa-layer-group" aria-hidden="true"></i> Feature
          </button>
        </div>

        <div class="popWinBody">
          <div id="selectEmptyHint" class="panel-empty-hint">Click a plot on the map to select it</div>
          <div id="selectSummary" class="select-panel__summary" hidden>
            <div id="selectSummaryName" class="select-panel__name"></div>
            <div id="selectSummaryMeta" class="select-panel__meta"></div>
          </div>
        </div>
      </div>

      <div id="selectActionsRow" class="popWinActionBtns" hidden>
        <div class="vsl-split-btn vsl-split-btn--log" id="selectLogSplitBtn">
          <button type="button" class="vsl-split-btn__main vsl-split-btn__main--log" id="selectLogMainBtn">
            <i class="fas fa-plus" aria-hidden="true"></i> Log
          </button>
          <label class="visually-hidden" for="selectLogModeSelect">Log type</label>
          <select id="selectLogModeSelect" class="vsl-split-btn__select vsl-split-btn__select--log">
            <option value="activity">Activity</option>
            <option value="alert">Alert</option>
          </select>
        </div>
        <button type="button" class="futuristic-icon-btn btn-add futuristic-icon-btn--modal-pad" id="selectInfoBtn">
          <i class="fas fa-info" aria-hidden="true"></i> Info
        </button>
      </div>
    </div>
