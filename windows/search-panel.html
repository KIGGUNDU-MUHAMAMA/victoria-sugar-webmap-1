    <section id="searchPanel" class="search-panel search-panel__card popWinMain popWin-mobileDock" hidden role="dialog" aria-modal="true" aria-labelledby="searchPanelTitle">
      <header class="popWinHead">
        <div class="popWinHead__inner">
          <span class="popWinIcon"><i class="fas fa-magnifying-glass" aria-hidden="true"></i></span>
          <h2 id="searchPanelTitle" class="popWinTitle">Search</h2>
        </div>
        <button type="button" class="popWinCloseBtn" id="searchPanelCloseBtn" aria-label="Close search panel">
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </header>

      <!-- Tab pills -->
      <div class="popWinTabs" role="tablist" aria-label="Search method">
        <button type="button" class="search-tab" id="tabParcel" role="tab" aria-selected="true" aria-controls="searchTabParcel" data-tab="parcel">
          <i class="fas fa-map-location-dot" aria-hidden="true"></i> Block / Parcel
        </button>
        <button type="button" class="search-tab" id="tabPlace" role="tab" aria-selected="false" aria-controls="searchTabPlace" data-tab="place">
          <i class="fas fa-magnifying-glass-location" aria-hidden="true"></i> Place
        </button>
        <button type="button" class="search-tab" id="tabCoords" role="tab" aria-selected="false" aria-controls="searchTabCoords" data-tab="coords">
          <i class="fas fa-crosshairs" aria-hidden="true"></i> Coordinates
        </button>
      </div>

      <div class="popWinBody">
        <!-- ── TAB 1: Block / Parcel Search ── -->
        <div id="searchTabParcel" class="search-panel__tab-body" role="tabpanel" aria-labelledby="tabParcel">
          <!-- Cascade: Estate → Block → Parcel -->
          <div class="futuristic-grid-3">
            <div class="futuristic-grid-item">
              <label class="search-panel__label" for="searchEstateSelect">Estate</label>
              <select id="searchEstateSelect" class="search-panel__input">
                <option value="">— Select Estate —</option>
              </select>
            </div>
            <div class="futuristic-grid-item">
              <label class="search-panel__label" for="searchBlockSelect">Block</label>
              <select id="searchBlockSelect" class="search-panel__input" disabled>
                <option value="">— Select Estate first —</option>
              </select>
            </div>
            <div class="futuristic-grid-item">
              <label class="search-panel__label" for="searchParcelSelect">Parcel / Plot</label>
              <select id="searchParcelSelect" class="search-panel__input" disabled>
                <option value="">— Select Block first —</option>
              </select>
            </div>
          </div>

          <p id="parcelSearchPopoverError" class="search-panel__error" role="alert" hidden></p>
        </div>

        <!-- ── TAB 2: Place Search ── -->
        <div id="searchTabPlace" class="search-panel__tab-body" role="tabpanel" aria-labelledby="tabPlace" hidden>
          <label class="visually-hidden" for="placeSearchInput">Place or address</label>
          <div class="search-panel__place-row futuristic-place-row">
            <input id="placeSearchInput" type="search" class="search-panel__input search-panel__place-input" placeholder="Town, road, landmark…" autocomplete="off" enterkeyhint="search">
          </div>
          <p id="placeSearchError" class="search-panel__error" role="alert" hidden></p>
          <ul id="placeSearchResults" class="place-search-results" hidden></ul>
          <p class="search-panel__attrib">Data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors · Nominatim</p>
        </div>

        <!-- ── TAB 3: Coordinate Search ── -->
        <div id="searchTabCoords" class="search-panel__tab-body" role="tabpanel" aria-labelledby="tabCoords" hidden>
          <label class="search-panel__label u-hidden" for="coordDrawerCrsSelect">Coordinate system</label>
          <select id="coordDrawerCrsSelect" class="search-panel__input u-hidden"></select>

          <div id="coordSingleBlock">
            <div class="futuristic-grid-2">
              <div class="futuristic-grid-item">
                <label class="search-panel__label" for="coordDrawerEasting">Longitudes</label>
                <input id="coordDrawerEasting" type="text" class="search-panel__input" inputmode="decimal" placeholder="e.g. 32.59" autocomplete="off">
              </div>
              <div class="futuristic-grid-item">
                <label class="search-panel__label" for="coordDrawerNorthing">Latitudes</label>
                <input id="coordDrawerNorthing" type="text" class="search-panel__input" inputmode="decimal" placeholder="e.g. 0.35" autocomplete="off">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- One shared Clear + Go pair, reused across all 3 tabs — see
           setupUnifiedSearchActionButtons() in map-app.js, which forwards
           each click to whichever tab is currently active. The original
           per-tab buttons below stay in the DOM (their existing listeners —
           runLocateParcelFromPopover(), runPlaceSearchQuery(), and the ones
           coord-search-drawer.js attaches — are untouched) but are never
           shown; setupUnifiedSearchActionButtons() triggers them with
           .click() instead of duplicating their logic. -->
      <div class="popWinActionBtns">
        <button type="button" class="futuristic-icon-btn btn-clear" id="searchClearBtn" title="Clear">
          <i class="fas fa-eraser" aria-hidden="true"></i>
        </button>
        <button type="button" class="futuristic-icon-btn btn-add" id="searchGoBtn" title="Go to">
          <i class="fas fa-location-arrow" aria-hidden="true"></i>
        </button>
      </div>

      <div hidden>
        <button type="button" id="parcelSearchPopoverCancelBtn" title="Clear highlight"></button>
        <button type="button" id="parcelSearchGoBtn" title="Go"></button>
        <button type="button" id="placeSearchGoBtn" title="Go"></button>
        <button type="button" id="coordClearMarkersBtn" title="Clear Markers"></button>
        <button type="button" id="coordPlotSingleBtn" title="Plot on Map"></button>
      </div>
    </section>
