    <!-- Snap toggle — a small floating widget, NOT a docked window like
         Legend/Search. Lives fixed to the viewport, sitting sticky just to
         the left of the OL layer-switcher button in #mapRightBtnStack (see
         .map-floating-snap-fab in styles.css) rather than inside that
         button cluster itself, so it's never subject to the cluster's own
         flex/order layout.

         Shown/hidden purely via the [hidden] attribute, in step with
         drafting mode — see enterDraftingMode()/exitDraftingMode() in
         js/map-app.js, called from Measure pick mode and the Survey
         window's Draw/Edit tabs. No collapse/expand of its own: it's just
         the 170x100 box, present for exactly as long as drafting mode is.
         exitDraftingMode() (via hideSnapFab()) also forces the toggle back
         on before hiding, so snapping can never be left silently off from a
         previous session — see hideSnapFab()'s own comment.

         #snapMasterCb used to be a real <input type="checkbox">; it's now a
         <button role="switch"> instead (styled as a track+thumb toggle) so
         readSnapOptions()/syncSnapPanel() in js/map-app.js read its state
         off the aria-checked attribute rather than .checked. Every other
         control that used to live here (the hint paragraph, and the
         per-layer Blocks/Plots/Survey preview checkboxes) is gone — snap
         is now a single on/off switch that (when on) snaps to every
         snappable layer at once. -->
    <div id="snapPanel" class="map-floating-snap-fab" hidden>
      <div class="map-floating-snap-fab__row">
        <button type="button" id="snapMasterCb" class="snap-toggle snap-toggle--on" role="switch" aria-checked="true" aria-label="Snap to existing geometry">
          <span class="snap-toggle__thumb"></span>
        </button>
        <span class="map-floating-snap-fab__label">Snap</span>
        
      </div>
    </div>
