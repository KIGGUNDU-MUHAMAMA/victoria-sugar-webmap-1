    <div id="parcelStatusPanel" class="parcel-status-panel popWinMain popWin-mobileDock" hidden>
      <header class="popWinHead">
        <div class="popWinHead__inner">
          <span class="popWinIcon"><i class="fas fa-arrow-pointer" aria-hidden="true"></i></span>
          <h2 id="parcelStatusTitle" class="popWinTitle">Select</h2>
        </div>
        <button type="button" class="popWinCloseBtn" id="parcelStatusCloseBtn" aria-label="Close select panel">
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </header>

      <!-- Tabs moved from a horizontal row below popWinHead to a vertical,
           left-docked column (see .popWinTabs--vertical / .popWinBodyRow in
           styles.css). -->
      <div class="popWinBodyRow">
        <div class="popWinTabs popWinTabs--vertical" role="tablist" aria-label="Select layer target">
          <button type="button" class="search-tab" id="modifyTabParcels" role="tab" aria-selected="true" data-tab="parcels">
            Plot
          </button>
          <button type="button" class="search-tab" id="modifyTabBlocks" role="tab" aria-selected="false" tabindex="-1" data-tab="blocks">
            Blocks
          </button>
          <button type="button" class="search-tab" id="modifyTabFeature" role="tab" aria-selected="false" tabindex="-1" data-tab="feature">
            Feature
          </button>
        </div>

        <div class="popWinBody">
          <div id="parcelStatusReadOnlyBanner" class="parcel-status-panel__banner" hidden>
            Sign in as <strong>Admin</strong> or <strong>Surveyor</strong> to save status changes.
          </div>

          <div id="parcelStatusSelectionLabel" class="panel-empty-hint">Select on map</div>

          <p id="parcelStatusFormError" class="parcel-status-panel__error" role="alert" hidden></p>
        </div>

        <!-- Busy overlay while Delete is in flight — same generic
             .popWinBody-covering pattern as the Survey window's Edit tab
             (see #surveyBusyOverlay/window.vslSurveyBusy in survey-panel.html/
             survey-edit.js). Toggled by setParcelStatusBusy() in map-app.js. -->
        <div id="parcelStatusBusyOverlay" class="uam-body-loading" hidden>
          <div class="uam-body-loading__spinner"></div>
          <span id="parcelStatusBusyOverlayText" class="uam-body-loading__text">Deleting…</span>
        </div>
      </div>

      <!-- Footer buttons now use the same .futuristic-icon-btn(--modal-pad)
           family as every other .popWinActionBtns footer in the app
           (search-panel, log-activity-modal, etc.) instead of the generic
           .btn-primary/.btn-secondary form-input styling, which had no
           dedicated .btn-primary base rule of its own and was falling back
           to the plain <button> reset (different padding/margin/radius) —
           that mismatch was the real cause of this window's padding/height
           looking inconsistent with the rest of the app's windows. -->
      <div id="parcelStatusActionsRow" class="popWinActionBtns" hidden>
        <button type="button" id="parcelStatusModifyBtn" class="futuristic-icon-btn btn-add futuristic-icon-btn--modal-pad"><i class="fas fa-pen" aria-hidden="true"></i> Modify</button>
        <button type="button" id="parcelStatusDeleteBtn" class="futuristic-icon-btn btn-clear futuristic-icon-btn--modal-pad futuristic-icon-btn--danger"><i class="fas fa-trash-alt" aria-hidden="true"></i> Delete</button>
      </div>
    </div>
