<!-- Log Activity modal — the one and only activity form, reached two ways:
     by clicking a plot or block on the map (its action popup), or straight
     from the Log Activity button in the left tool stack, which every role
     can see.

     ── TWO STEPS ──
     Showing the location dropdowns and every activity field at once made a
     tall form where the part you had already dealt with kept taking up room.
     So it is split:

       1. SETUP   — pick the activity, then Estate → Block → Plot. "Next".
       2. DETAILS — just the fields for that activity. The location collapses
                    into the summary chip beside the activity dropdown;
                    clicking that chip comes back to step 1 with everything
                    still chosen.

     Both routes in start at step 1 — arriving from a map click only means
     the location dropdowns are already filled, since the activity still has
     to be picked. See setLogActivityStep() in js/map-app.js. -->
<div id="logActivityModal" class="vsl-modal-overlay" hidden>
  <div class="vsl-modal-card vsl-modal-card--wide popWinMain">
    <header class="popWinHead">
      <div class="popWinHead__inner">
        <span class="popWinIcon"><i class="fas fa-person-digging" aria-hidden="true"></i></span>
        <h2 id="logActivityTitle" class="popWinTitle">Log Activity</h2>
      </div>
      <button type="button" class="popWinCloseBtn" id="logActivityCloseBtn" aria-label="Close log activity">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </header>

    <!-- Activity picker, plus (on step 2 only) the collapsed location. The
         chip is a button because it is the way back to step 1 — the
         location is never re-shown as dropdowns alongside the fields. -->
    <div class="popWinTabs log-head">
      <select id="logActivitySelect" class="popWinTabs__select" aria-label="Select activity">
        <option value="">-- Select Activity --</option>
      </select>
      <button type="button" id="logActivityTargetChip" class="log-chip" hidden
              title="Change where this is logged">
        <span class="log-chip__line" id="logChipEstate"></span>
        <span class="log-chip__line" id="logChipBlock"></span>
        <span class="log-chip__line log-chip__line--plot" id="logChipPlot"></span>
      </button>
    </div>

    <form id="logActivityForm" novalidate class="popWin-formShell">
      <div class="popWinBody vsl-modal-form">
        <!-- ── STEP 1: where the work happened ──
             Prefilled when you arrive from a map click, empty from the tool
             stack. Plot is optional: leaving it on "All plots" logs against
             the whole block, which is what the warning says. -->
        <div id="logActivityStepLocation">
          <div class="vsl-section-label">Location</div>
          <div class="log-target">
            <label class="log-target__label" for="logActivityEstate">Estate</label>
            <select id="logActivityEstate" class="uam-select">
              <option value="">— Select estate —</option>
            </select>

            <label class="log-target__label" for="logActivityBlock">Block</label>
            <select id="logActivityBlock" class="uam-select" disabled>
              <option value="">— Select estate first —</option>
            </select>

            <label class="log-target__label" for="logActivityPlot">Plot</label>
            <select id="logActivityPlot" class="uam-select" disabled>
              <option value="">— Select block first —</option>
            </select>
          </div>

          <p id="logActivityBlockWarning" class="feature-info-readonly-msg" hidden>
            <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
            No plot chosen — this activity will be logged against every plot in the block.
          </p>

          <p id="logActivityEmptyHint" class="map-popup__empty">Pick an activity above and where it happened, then press Next.</p>
        </div>

        <!-- ── STEP 2: the activity's own fields ── -->
        <div id="logActivityFieldsWrap" hidden>
          <div class="vsl-section-label">General Details</div>
          <table class="map-popup__table vsl-prop-table">
            <tbody id="logActivityCommonFields"></tbody>
          </table>
          <div id="logActivityPropsSection" hidden>
            <div class="vsl-section-label vsl-section-label--second">Other Details</div>
            <table class="map-popup__table vsl-prop-table" id="logActivityPropsTable">
              <tbody id="logActivityPropsFields"></tbody>
            </table>
          </div>

          <!-- Photos/videos — a COMMON field, not part of any one activity's
               own properties: evidence applies to every kind of work, so it
               sits outside #logActivityPropsFields (which is driven by the
               selected activity's catalogue definition).

               Files are held in memory until the record saves. They upload
               afterwards, keyed to the row id(s) the insert returns — see
               attachMediaToRecords in js/media-store.js. Uploading first
               would strand objects in the bucket whenever a save failed. -->
          <div class="vsl-section-label vsl-section-label--second">Photos</div>
          <div class="vsl-media-attach">
            <label class="vsl-media-attach__pick">
              <i class="fas fa-camera" aria-hidden="true"></i>
              <span>Attach photos or video</span>
              <input type="file" id="logActivityMediaInput" class="vsl-media-attach__input"
                     accept=".jpg,.jpeg,.png,.webp,.heic,.heif,.mp4,.mov,.webm,image/*,video/*" multiple>
            </label>
            <ul class="vsl-media-attach__list" id="logActivityMediaList"></ul>
            <p class="vsl-media-attach__hint">Up to 25MB each. Only people signed in to this app can view them.</p>
          </div>
        </div>

        <p id="logActivityError" class="search-panel__error" role="alert" hidden></p>
      </div>

      <!-- One footer, two buttons — only ever one of them visible, so the
           action always matches the step you are on. Next is type="button"
           on purpose: submitting is step 2's job, and a stray Enter on step 1
           must advance rather than save a half-filled record. -->
      <div class="popWinActionBtns">
        <button type="button" id="logActivityNextBtn" class="futuristic-icon-btn btn-add futuristic-icon-btn--modal-pad" disabled>
          Next <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </button>
        <button type="submit" id="logActivitySaveBtn" class="futuristic-icon-btn btn-add futuristic-icon-btn--modal-pad" hidden>Log Activity</button>
      </div>
    </form>
  </div>
</div>
